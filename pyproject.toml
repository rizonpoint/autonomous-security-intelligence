[project]
name = "autonomous-security-intelligence"
version = "0.1.0"
description = "Provider-neutral control plane for autonomous security intelligence agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
